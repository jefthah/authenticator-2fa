name: Release

# Push a tag like v1.2.0 (must match manifest.json "version") to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./authenticator-extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version v$version"
            exit 1
          fi
      - name: Build zip
        run: |
          zip -r -X "Authenticator-2FA-$GITHUB_REF_NAME.zip" authenticator-extension -x '*.DS_Store'
          sha256sum "Authenticator-2FA-$GITHUB_REF_NAME.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## " v) == 1 { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Install"
            echo "Download the zip below, extract it, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and select the \`authenticator-extension\` folder."
          } >> release-notes.md
          cat release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Authenticator-2FA-$GITHUB_REF_NAME.zip" SHA256SUMS.txt \
            --title "Authenticator 2FA $GITHUB_REF_NAME" \
            --notes-file release-notes.md
