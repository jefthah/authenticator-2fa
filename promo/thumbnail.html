<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Authenticator 2FA thumbnail</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { margin: 0; overflow: hidden; }
  body { width: var(--W); height: var(--H); background: #071027; }
  .stage {
    position: relative; width: var(--W); height: var(--H); overflow: hidden; color: #fff;
    font-family: var(--text);
    background:
      radial-gradient(900px 620px at 82% 38%, rgb(59 130 246 / 55%), transparent 62%),
      radial-gradient(700px 520px at 2% 105%, rgb(124 58 237 / 38%), transparent 60%),
      radial-gradient(520px 420px at 30% -10%, rgb(14 165 233 / 28%), transparent 60%),
      linear-gradient(135deg, #060d24 0%, #0a1a48 52%, #0f2f86 100%);
  }
  .dots {
    position: absolute; inset: 0; opacity: 0.22;
    background-image: radial-gradient(circle, rgb(255 255 255 / 55%) 1px, transparent 1.4px);
    background-size: 26px 26px;
    mask-image: radial-gradient(900px 600px at 30% 40%, #000 0%, transparent 75%);
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 14px; font: 700 26px/1 var(--display); letter-spacing: -0.01em; }
  .logo svg { filter: drop-shadow(0 6px 18px rgb(37 99 235 / 55%)); }
  h1 {
    margin: 30px 0 0; font: 700 70px/1.02 var(--display); letter-spacing: -0.035em;
  }
  h1 .hl {
    background: linear-gradient(90deg, #7dd3fc 0%, #a5b4fc 55%, #f0abfc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 22px 0 0; font-size: 21px; line-height: 1.45; color: rgb(226 232 255 / 82%); max-width: 540px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; max-width: 580px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px 9px 12px; border-radius: 999px;
    font-size: 16px; font-weight: 600; background: rgb(255 255 255 / 9%); border: 1px solid rgb(255 255 255 / 16%);
    color: #e7ecff;
  }
  .chip svg { color: #93c5fd; }
  .foot { display: flex; align-items: center; gap: 14px; margin-top: 34px; }
  .free {
    padding: 7px 12px; border-radius: 8px; font: 800 13px/1 var(--text); letter-spacing: 0.08em;
    background: linear-gradient(90deg, #22c55e, #16a34a); color: #fff; text-transform: uppercase;
  }
  .url { font: 600 17px/1 var(--mono); color: rgb(226 232 255 / 75%); }

  .browser {
    position: absolute; left: 690px; right: -24px; top: 44px; height: 58px; border-radius: 14px 0 0 14px;
    background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 18px;
    box-shadow: 0 20px 50px rgb(0 0 0 / 35%);
  }
  .addr {
    flex: 1; height: 36px; border-radius: 999px; background: #f1f3f4; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; color: #5f6368; font-size: 15px;
  }
  .ext { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #dbe7ff; box-shadow: 0 0 0 3px rgb(37 99 235 / 35%); }
  .tb { width: 34px; height: 34px; display: grid; place-items: center; color: #5f6368; }
  .me { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); margin-right: 26px; }

  .popwrap { position: absolute; top: 118px; transform-origin: top right; }
  .popwrap .pm { box-shadow: 0 40px 90px rgb(2 6 23 / 60%), 0 10px 30px rgb(2 6 23 / 35%); }
  .toast {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap;
    background: #15181d; color: #f6f7f9; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px;
  }
  .glow { position: absolute; width: 640px; height: 640px; right: 40px; top: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgb(96 165 250 / 45%), transparent 65%); filter: blur(10px); }

  .qrcard {
    position: absolute; padding: 14px 14px 12px; background: #fff; border-radius: 18px; transform: rotate(-9deg);
    box-shadow: 0 30px 60px rgb(2 6 23 / 55%); color: #15181d; text-align: center;
  }
  .qrcard .lbl { margin-top: 8px; font: 700 14px/1 var(--text); color: #15803d; display: flex; gap: 6px; justify-content: center; align-items: center; }
  .lockbadge {
    position: absolute; display: flex; align-items: center; gap: 10px; padding: 12px 18px 12px 14px; border-radius: 16px;
    background: rgb(15 23 42 / 82%); border: 1px solid rgb(255 255 255 / 14%); font-weight: 700; font-size: 16px;
    box-shadow: 0 20px 40px rgb(2 6 23 / 45%); backdrop-filter: blur(6px);
  }
  .lockbadge .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #16a34a; }
  .lockbadge small { display: block; font-weight: 500; font-size: 13px; color: rgb(226 232 255 / 70%); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="left">
    <div class="logo" id="logo"></div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="chips" id="chips"></div>
    <div class="foot"><span class="free" id="free"></span><span class="url">github.com/jefthah/authenticator-2fa</span></div>
  </div>
  <div class="browser" id="browser"></div>
  <div class="qrcard" id="qrcard"></div>
  <div class="popwrap" id="popwrap"></div>
  <div class="lockbadge" id="lockbadge"></div>
</div>
<script src="shared.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'id' ? 'id' : 'en';
  const W = Number(q.get('w') || 1280), H = Number(q.get('h') || 720);
  document.documentElement.lang = lang;
  document.body.style.setProperty('--W', W + 'px');
  document.body.style.setProperty('--H', H + 'px');
  const { icon, brandIcon, popup, setTimer, fakeQR } = Promo;

  const T = {
    en: {
      h1: 'Your 2FA codes,<br><span class="hl">one click away.</span>',
      sub: 'Move every account from Google Authenticator with one QR scan. Encrypted, and synced between your laptops.',
      chips: [['qr', 'Import from Google Authenticator'], ['lock', 'AES-256 encrypted'], ['sync', 'Syncs between laptops']],
      free: 'Free · Open source',
      search: 'Search accounts…', copied: 'Copied', toast: 'Nimbus Mail code copied',
      qr: 'QR 1', lock: ['Encrypted vault', 'Only your password opens it'],
    },
    id: {
      h1: 'Semua kode 2FA,<br><span class="hl">cukup sekali klik.</span>',
      sub: 'Pindahkan semua akun dari Google Authenticator dengan sekali pindai QR. Terenkripsi dan tersinkron antar laptop.',
      chips: [['qr', 'Import dari Google Authenticator'], ['lock', 'Terenkripsi AES-256'], ['sync', 'Sinkron antar laptop']],
      free: 'Gratis · Open source',
      search: 'Cari akun…', copied: 'Disalin', toast: 'Kode Nimbus Mail disalin',
      qr: 'QR 1', lock: ['Brankas terenkripsi', 'Hanya Anda yang bisa membukanya'],
    },
  }[lang];

  document.getElementById('logo').innerHTML = `${brandIcon(56)}<span>Authenticator 2FA</span>`;
  document.getElementById('h1').innerHTML = T.h1;
  document.getElementById('sub').textContent = T.sub;
  document.getElementById('chips').innerHTML = T.chips.map(([i, s]) => `<span class="chip">${icon(i, 18)}${s}</span>`).join('');
  document.getElementById('free').textContent = T.free;
  document.getElementById('browser').innerHTML =
    `<div class="addr">${icon('lock', 15)}<span>accounts.example.com</span></div>
     <span class="tb">${icon('globe', 20)}</span><span class="ext">${brandIcon(24)}</span><span class="me"></span>`;

  // Akun contoh fiktif.
  const accounts = [
    { issuer: 'Nimbus Mail', name: 'demo@example.com', code: '482913' },
    { issuer: 'Atlas Cloud', name: 'admin@example.com', code: '105774' },
    { issuer: 'Orbit Pay', name: 'demo.user', code: '639208' },
    { issuer: 'Pixel Studio', name: 'design@example.org', code: '917352' },
    { issuer: 'Lumen Docs', name: 'team@example.com', code: '270846' },
  ];
  const pop = popup(accounts, { search: T.search, copied: T.copied });
  pop.root.style.position = 'relative';
  pop.rows.forEach((r, i) => setTimer(r, 19 - i * 0.0));
  pop.rows[0].li.classList.add('hover');
  pop.rows[0].badge.style.opacity = 1;
  pop.root.insertAdjacentHTML('beforeend', `<div class="toast">${T.toast}</div>`);
  const wrap = document.getElementById('popwrap');
  wrap.append(pop.root);

  const qr = document.getElementById('qrcard');
  qr.innerHTML = `${fakeQR(170, 11)}<div class="lbl">${icon('check', 16)}${T.qr}</div>`;
  const lock = document.getElementById('lockbadge');
  lock.innerHTML = `<span class="ic">${icon('lock', 20)}</span><span>${T.lock[0]}<small>${T.lock[1]}</small></span>`;

  // Tata letak menyesuaikan tinggi kanvas (720 untuk thumbnail, 640 untuk GitHub).
  const ext = document.querySelector('.ext').getBoundingClientRect();
  const natural = pop.root.offsetHeight;
  const scale = Math.min(1.2, (H - 118 - 22) / natural);
  wrap.style.transform = `scale(${scale})`;
  wrap.style.left = (ext.right + 14 - 360) + 'px';
  const popRect = pop.root.getBoundingClientRect();
  qr.style.left = (popRect.left - 178) + 'px';
  qr.style.top = (popRect.top + popRect.height * 0.14) + 'px';
  lock.style.left = (popRect.left + 50 - lock.offsetWidth) + 'px';
  lock.style.top = (popRect.bottom - popRect.height * 0.35) + 'px';
</script>
</body>
</html>
